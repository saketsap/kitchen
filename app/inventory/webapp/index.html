<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kitchen Inventory</title>
    <style>
        /* Without an explicit height chain, some browsers/theme-load timings
           collapse html/body to their content's natural (near-zero) height
           instead of the viewport, since percentage heights only resolve
           against an ancestor with an explicit (non-percentage) height. */
        html, body, #content, #container, #container-uiarea, .sapUiView { height: 100vh !important; margin: 0; }
    </style>
    <script
        id="sap-ui-bootstrap"
        src="https://ui5.sap.com/resources/sap-ui-core.js"
        data-sap-ui-theme="sap_horizon"
        data-sap-ui-resourceroots='{"kitchen.inventory": "./"}'
        data-sap-ui-oninit="module:sap/ui/core/ComponentSupport"
        data-sap-ui-compatVersion="edge"
        data-sap-ui-async="true"
        data-sap-ui-frameOptions="trusted"
        data-sap-ui-libs="sap.fe.templates">
    </script>
</head>
<body class="sapUiBody" id="content">
    <div
        data-sap-ui-component
        data-name="kitchen.inventory"
        data-id="container"
        data-settings='{"id": "kitchen.inventory"}'
        data-handle-validation="true">
    </div>
</body>
</html>
